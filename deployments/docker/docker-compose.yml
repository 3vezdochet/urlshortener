services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: urlshortener
      POSTGRES_PASSWORD: urlshortener
      POSTGRES_DB: urlshortener
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urlshortener"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.api
    entrypoint: ["/usr/local/bin/migrate"]
    environment:
      DATABASE_URL: postgres://urlshortener:urlshortener@postgres:5432/urlshortener?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://urlshortener:urlshortener@postgres:5432/urlshortener?sslmode=disable
      REDIS_ADDR: "redis:6379"
      # Dev-only key so the stack is usable out of the box:
      #   curl -X POST localhost:8080/v1/links -H 'X-API-Key: dev-key' -d '{"url":"https://example.com"}'
      # Replace/extend for anything beyond local development.
      API_KEYS: "dev-key:dev"
      # The rate limiter is a separate, standalone service (not part of
      # this compose file — see README's "Rate limiting" section). Point
      # this at wherever you run it, e.g. "host.docker.internal:PORT" for
      # one running on the host outside Docker. Leave unset to run with no
      # rate limiting, same as today.
      # RATE_LIMITER_ADDR: "host.docker.internal:50051"
      OTEL_EXPORTER_OTLP_ENDPOINT: "jaeger:4318"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  checker:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.api
    entrypoint: ["/usr/local/bin/checker"]
    ports:
      - "9090:9090" # metrics only — checker has no other HTTP surface
    environment:
      DATABASE_URL: postgres://urlshortener:urlshortener@postgres:5432/urlshortener?sslmode=disable
      CHECKER_INTERVAL_SECONDS: "30"
      OTEL_EXPORTER_OTLP_ENDPOINT: "jaeger:4318"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  jaeger:
    image: jaegertracing/all-in-one:1.70.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4318:4318"   # OTLP/HTTP receiver

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"
    depends_on:
      - api
      - checker

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
